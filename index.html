<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Drift Test V1.2.1</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head><body>
<canvas id="game"></canvas>

<div id="rotateScreen" class="overlay hidden">
  <div class="panel"><div class="rotateIcon">↻</div><h1>TURN YOUR PHONE</h1><p>Rotate to landscape to continue.</p></div>
</div>

<div id="startScreen" class="overlay">
  <div class="panel"><h1>DRIFT TEST V1.2.1</h1><p>Weight transfer and persistent rear-slip test.</p><button id="startBtn">START DRIVING</button></div>
</div>

<div id="hud"><span id="speed">0 MPH</span><span id="angle">0°</span><span id="grip">100%</span></div>

<div id="controls">
  <div><button id="left">◀</button><button id="right">▶</button></div>
  <div><button id="hand" class="wide">E-BRAKE</button><button id="brake" class="brake">BRAKE</button><button id="gas" class="gas">GAS</button></div>
</div>

<script src="app.js"></script>
</body></html>
