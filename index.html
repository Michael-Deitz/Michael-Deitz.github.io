<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Drift Test V1.1</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="gameRoot">
  <canvas id="game"></canvas>

  <div id="rotateScreen" class="overlay">
    <div class="panel">
      <div class="rotateIcon">↻</div>
      <h1>TURN YOUR PHONE</h1>
      <p>This drift test is designed for landscape mode.</p>
    </div>
  </div>

  <div id="startScreen" class="overlay show">
    <div class="panel">
      <h1>DRIFT TEST V1.1</h1>
      <p>Larger drift pad and easier drift initiation.</p>
      <button id="startBtn" class="startButton">START DRIVING</button>
    </div>
  </div>

  <div id="hud">
    <div><span>SPEED</span><strong id="speed">0 MPH</strong></div>
    <div><span>ANGLE</span><strong id="angle">0°</strong></div>
    <div><span>GEAR</span><strong id="gear">1</strong></div>
  </div>

  <div id="controls">
    <div class="leftControls">
      <button id="leftBtn" class="circle">◀</button>
      <button id="rightBtn" class="circle">▶</button>
    </div>
    <div class="rightControls">
      <button id="handBtn" class="rect">E-BRAKE</button>
      <button id="brakeBtn" class="circle brake">BRAKE</button>
      <button id="gasBtn" class="circle gas">GAS</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
