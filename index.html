<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Drift Third Person V3.3.3</title>
<link rel="stylesheet" href="style.css?v=333">
<link rel="manifest" href="manifest.json?v=333">
</head>
<body>
<div id="game"></div>

<div id="loading">LOADING 3D TEST…</div>

<div id="rotateScreen" class="overlay hidden">
  <div class="panel">
    <div class="rotateIcon">↻</div>
    <h1>TURN YOUR PHONE</h1>
    <p>The test runs in landscape.</p>
  </div>
</div>

<div id="hud">
  <span id="speed">0 MPH</span>
  <span id="angle">0°</span>
  <span id="state">GRIP</span>
  <span id="grip">G 100%</span>
</div>

<button id="resetBtn">RESET</button>
<div id="versionLabel">V3.3.3 3D TEST</div>

<div id="controls">
  <div>
    <button id="left" aria-label="Steer left">◀</button>
    <button id="right" aria-label="Steer right">▶</button>
  </div>
  <div>
    <button id="hand" class="wide" aria-label="Handbrake">E-BRAKE</button>
    <button id="brake" class="brake" aria-label="Brake">BRAKE</button>
    <button id="gas" class="gas" aria-label="Gas">GAS</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="car-config.js?v=333"></script>
<script src="app.js?v=333"></script>
</body>
</html>
