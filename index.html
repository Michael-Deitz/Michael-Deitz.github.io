<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1016"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sprinkler Helper</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"></head><body>
<header><div class="bar"><div><h1>Sprinkler Helper</h1><p>Job-based field takeoffs</p></div><button onclick="home()">Home</button></div></header>
<main>
<section id="jobs" class="screen active"><div class="hero"><div><h2>My Jobs</h2><p>Keep each takeoff tied to the job where it was used.</p></div><button class="red" onclick="show('new')">+ New Job</button></div><input id="search" placeholder="Search jobs" oninput="renderJobs()"><div id="jobList"></div></section>
<section id="new" class="screen"><button class="back" onclick="home()">← Back</button><div class="card"><h2>Create Job</h2><label>Job name</label><input id="jname"><label>Job number <small>optional</small></label><input id="jnum"><label>Location <small>optional</small></label><input id="jloc"><label>Date</label><input id="jdate" type="date"><button id="createBtn" class="red full" onclick="createJob()">Create Job</button><div id="newStatus" class="result">Enter a job name.</div></div></section>
<section id="job" class="screen"><button class="back" onclick="home()">← All Jobs</button><div class="jobhead"><div><h2 id="jobTitle"></h2><p id="jobMeta"></p></div><button class="danger" onclick="delJob()">Delete</button></div><div class="card"><h3>Job Summary</h3><div id="summary"></div></div><div class="grid">
<button onclick="tool('pipe')">🔩<b>Pipe</b><small>Footage and sticks</small></button><button onclick="tool('hanger')">🪛<b>Hangers</b><small>All-thread totals</small></button><button onclick="tool('drops')">💧<b>Drops / Sprigs</b><small>Repeated lengths</small></button><button onclick="tool('heads')">🚿<b>Sprinklers</b><small>Track quantities</small></button><button onclick="tool('material')">📋<b>Materials</b><small>Fittings and items</small></button><button onclick="tool('notes')">📝<b>Notes</b><small>Job-specific notes</small></button></div><div class="card"><h3>History</h3><div id="history"></div></div></section>
<section id="tool" class="screen"><button class="back" onclick="openJob(current)">← Back to Job</button><div id="toolBox"></div></section>
</main><footer>Prototype V3 • Verify against approved plans and requirements.</footer><script src="app.js"></script></body></html>
